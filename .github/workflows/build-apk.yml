name: Build Android APK

on:
  push:
      branches: [ "main" ]

      jobs:
        build:
            runs-on: ubuntu-latest
                steps:
                    - name: Checkout Source Code
                          uses: actions/checkout@v4

                              - name: Set up Java Development Kit (JDK 17)
                                    uses: actions/setup-java@v4
                                          with:
                                                  distribution: 'zulu'
                                                          java-version: '17'

                                                              - name: Setup Gradle Automatically
                                                                    uses: gradle/actions/setup-gradle@v4
                                                                          with:
                                                                                  gradle-version: '8.1.1' # Server otomatis mengunduh Gradle sendiri

                                                                                      - name: Build Debug APK with Automated Gradle
                                                                                            run: gradle assembleDebug --no-daemon
                                                                                                  continue-on-error: false

                                                                                                      - name: Upload Finished APK
                                                                                                            uses: actions/upload-artifact@v4
                                                                                                                  with:
                                                                                                                          name: Equalizer-Debug-APK
                                                                                                                                  path: app/build/outputs/apk/debug/app-debug.apk
                                                                                                                                  